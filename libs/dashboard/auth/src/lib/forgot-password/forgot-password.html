<article class="auth-card">
  <p class="auth-card__eyebrow">Récupération</p>
  <h2>Mot de passe oublié</h2>
  <p class="auth-card__lead">
    Saisissez votre e-mail pour recevoir un lien de réinitialisation sécurisé.
  </p>

  @if (error()) {
    <p class="auth-card__error" role="alert">{{ error() }}</p>
  }
  @if (success()) {
    <p class="auth-card__success" role="status">{{ success() }}</p>
  }

  <form class="auth-card__form" (submit)="onSubmit($event)">
    <div class="auth-field">
      <label for="forgot-email">E-mail</label>
      <input
        pInputText
        id="forgot-email"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
        placeholder="vous@exemple.fr"
      />
    </div>
    <div class="auth-card__actions">
      <p-button
        type="submit"
        label="Envoyer le lien"
        icon="pi pi-envelope"
        [loading]="loading()"
        [disabled]="loading()"
      />
    </div>
  </form>

  <p class="auth-card__footer">
    <a routerLink="/auth/connexion">Retour à la connexion</a>
  </p>
</article>
