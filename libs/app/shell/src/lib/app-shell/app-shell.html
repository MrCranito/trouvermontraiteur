<div class="app-shell">
  <tmt-topbar
    brandName="Eventup"
    [dashboardUrl]="dashboardUrl"
    [auth]="authState()"
    loginHref="/auth/connexion"
    (signOut)="signOut()"
  >
    <tmt-language-switcher topbarTools />
  </tmt-topbar>
  <main class="app-shell__main">
    <router-outlet />
  </main>
  <tmt-favorite-login-dialog />
  <tmt-footer
    brandName="Eventup"
    tagline="Trouvez les artisans pour votre événement, partout en France."
    note="Fait avec soin pour vos événements."
    [dashboardHref]="dashboardUrl"
  />
</div>
