<article class="auth-card">
  <p class="auth-card__eyebrow">Mon compte</p>
  <h2>Connexion</h2>
  <p class="auth-card__lead">
    Retrouvez vos favoris et continuez la préparation de votre projet.
  </p>

  @if (error()) {
    <p class="auth-card__error" role="alert">{{ error() }}</p>
  }

  <form class="auth-card__form" (submit)="onSubmit($event)">
    <div class="auth-field">
      <label for="login-email">E-mail</label>
      <input
        pInputText
        id="login-email"
        type="email"
        name="email"
        [(ngModel)]="email"
        autocomplete="email"
        required
        placeholder="vous@exemple.fr"
      />
    </div>
    <div class="auth-field">
      <label for="login-password">Mot de passe</label>
      <p-password
        inputId="login-password"
        name="password"
        [(ngModel)]="password"
        [feedback]="false"
        [toggleMask]="true"
        autocomplete="current-password"
        required
        placeholder="••••••••"
      />
    </div>

    <div class="auth-card__links">
      <a routerLink="/auth/mot-de-passe-oublie">Mot de passe oublié ?</a>
    </div>

    <div class="auth-card__actions">
      <p-button
        type="submit"
        label="Se connecter"
        icon="pi pi-sign-in"
        [loading]="loading()"
        [disabled]="loading()"
      />
      <span class="auth-card__divider">ou</span>
      <p-button
        type="button"
        label="Continuer avec Google"
        styleClass="auth-google-btn"
        severity="secondary"
        [outlined]="true"
        [loading]="loading()"
        [disabled]="loading()"
        (onClick)="onGoogle()"
      >
        <ng-template pTemplate="icon">
          <tmt-google-icon />
        </ng-template>
      </p-button>
    </div>
  </form>

  <p class="auth-card__footer">
    Pas encore de compte ?
    <a routerLink="/auth/inscription">Créer un compte</a>
  </p>
</article>
