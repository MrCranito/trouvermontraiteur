<article class="auth-card">
  <p class="auth-card__eyebrow">Récupération</p>
  <h2>Nouveau mot de passe</h2>

  @if (!recoveryReady()) {
    <p class="auth-card__lead">
      Ouvrez le lien reçu par e-mail pour définir un nouveau mot de passe.
    </p>
    <p class="auth-card__footer">
      <a routerLink="/auth/mot-de-passe-oublie">Demander un nouveau lien</a>
    </p>
  } @else {
    <p class="auth-card__lead">Choisissez un mot de passe sécurisé pour votre compte.</p>

    @if (error()) {
      <p class="auth-card__error" role="alert">{{ error() }}</p>
    }
    @if (success()) {
      <p class="auth-card__success" role="status">{{ success() }}</p>
    }

    <form class="auth-card__form" (submit)="onSubmit($event)">
      <div class="auth-field">
        <label for="reset-password">Nouveau mot de passe</label>
        <p-password
          inputId="reset-password"
          name="password"
          [(ngModel)]="password"
          [toggleMask]="true"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="auth-field">
        <label for="reset-confirm">Confirmer</label>
        <p-password
          inputId="reset-confirm"
          name="confirmPassword"
          [(ngModel)]="confirmPassword"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          required
        />
      </div>
      <div class="auth-card__actions">
        <p-button
          type="submit"
          label="Enregistrer le mot de passe"
          icon="pi pi-check"
          [loading]="loading()"
          [disabled]="loading()"
        />
      </div>
    </form>
  }
</article>
