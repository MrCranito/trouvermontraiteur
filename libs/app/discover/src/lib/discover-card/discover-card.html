<article class="discover-card">
  <button
    type="button"
    class="discover-card__favorite"
    [class.discover-card__favorite--on]="isFavorite()"
    [attr.aria-label]="
      isFavorite() ? 'Retirer des favoris' : 'Ajouter aux favoris'
    "
    [attr.aria-pressed]="isFavorite()"
    (click)="onFavoriteClick($event)"
  >
    <i
      [class]="isFavorite() ? 'pi pi-heart-fill' : 'pi pi-heart'"
      aria-hidden="true"
    ></i>
  </button>
  <a class="discover-card__link" [routerLink]="['/artisans', craftsman().id]">
  <div class="discover-card__media">
    <img [src]="coverImage()" [alt]="craftsman().name" loading="lazy" />
    @if (craftsman().certified) {
      <tmt-certified-badge
        class="discover-card__certified-chip"
        variant="overlay"
        label="Certifié"
      />
    }
  </div>
  <div class="discover-card__body">
    <div class="discover-card__row">
      <div class="discover-card__name-wrap">
        <h3 class="discover-card__name">{{ craftsman().name }}</h3>
        @if (craftsman().certified) {
          <tmt-certified-badge class="discover-card__certified" [size]="16" />
        }
      </div>
      @if (craftsman().rating > 0) {
        <span class="discover-card__rating">
          <i class="pi pi-star-fill" aria-hidden="true"></i>
          {{ ratingLabel() }}
        </span>
      }
    </div>
    <p class="discover-card__meta">{{ subtitle() }}</p>
  </div>
  </a>
</article>
