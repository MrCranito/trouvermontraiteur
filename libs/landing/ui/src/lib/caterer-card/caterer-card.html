<p-card
  class="caterer-card"
  [class.caterer-card--list]="layout() === 'list'"
  [class.caterer-card--featured]="variant() === 'featured'"
  [style]="{ overflow: 'hidden' }"
>
  <ng-template #header>
    <div class="caterer-card__media">
      <img
        [src]="craftsman().imageUrl"
        [alt]="craftsman().name"
        loading="lazy"
      />
    </div>
  </ng-template>

  <div class="caterer-card__body">
    <div class="caterer-card__head">
      <h3>{{ craftsman().name }}</h3>
      <p-rating
        [ngModel]="craftsman().rating"
        [readonly]="true"
        [stars]="5"
      />
      <span class="caterer-card__reviews"
        >{{ craftsman().rating }} · {{ craftsman().reviewCount }} avis</span
      >
    </div>

    <p class="caterer-card__description">{{ craftsman().description }}</p>

    <div class="caterer-card__tags">
      @for (trade of craftsman().trades.slice(0, 3); track trade) {
        <p-tag [value]="tradeLabels[trade]" severity="secondary" />
      }
    </div>

    <p class="caterer-card__location">
      <i class="pi pi-map-marker"></i>
      {{ craftsman().location.city }} — {{ craftsman().location.address }}
    </p>
  </div>

  <ng-template #footer>
    @if (detailUrl(); as url) {
      <a [href]="url" target="_blank" rel="noopener noreferrer" class="caterer-card__cta">
        <p-button
          label="Voir l’artisan"
          icon="pi pi-arrow-right"
          iconPos="right"
        />
      </a>
    } @else {
      <p-button
        label="Voir l’artisan"
        icon="pi pi-arrow-right"
        iconPos="right"
        [routerLink]="['/artisans', craftsman().slug]"
      />
    }
  </ng-template>
</p-card>
