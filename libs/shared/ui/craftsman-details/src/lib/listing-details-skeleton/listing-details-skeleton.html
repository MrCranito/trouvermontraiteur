<article
  class="listing listing--skeleton"
  aria-busy="true"
  aria-label="Chargement de la fiche artisan"
>
  <div class="listing__container">
    <div class="listing__top-actions">
      <span class="listing-skeleton__action"></span>
      <span class="listing-skeleton__action"></span>
    </div>

    <div class="listing-skeleton__photos" aria-hidden="true"></div>

    <header class="listing-skeleton__head">
      <span class="listing-skeleton__title"></span>
      <span class="listing-skeleton__meta"></span>
    </header>

    <hr class="listing__rule" />

    <div class="listing__layout">
      <div class="listing__main">
        <section class="listing-skeleton__block">
          <span class="listing-skeleton__heading"></span>
          <span class="listing-skeleton__line"></span>
          <span class="listing-skeleton__line"></span>
          <span class="listing-skeleton__line listing-skeleton__line--short"></span>
        </section>

        <section class="listing-skeleton__block">
          <span class="listing-skeleton__heading"></span>
          <div class="listing-skeleton__calendar"></div>
        </section>

        <section class="listing-skeleton__block">
          <span class="listing-skeleton__heading"></span>
          <span class="listing-skeleton__line listing-skeleton__line--medium"></span>
          <span class="listing-skeleton__line listing-skeleton__line--medium"></span>
        </section>
      </div>

      <aside class="listing-skeleton__aside" aria-hidden="true">
        <span class="listing-skeleton__price"></span>
        <span class="listing-skeleton__cta"></span>
        <span class="listing-skeleton__fact"></span>
        <span class="listing-skeleton__fact listing-skeleton__fact--short"></span>
      </aside>
    </div>
  </div>
</article>
