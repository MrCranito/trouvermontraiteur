<a
  class="map-marker-popup"
  [routerLink]="['/artisans', craftsman().slug]"
  (click)="$event.stopPropagation()"
>
  <div class="map-marker-popup__media">
    <img [src]="craftsman().imageUrl" [alt]="craftsman().name" loading="lazy" />
  </div>
  <div class="map-marker-popup__body">
    <div class="map-marker-popup__head">
      <h3 class="map-marker-popup__name">{{ craftsman().name }}</h3>
      <span class="map-marker-popup__rating">
        <i class="pi pi-star-fill" aria-hidden="true"></i>
        {{ ratingLabel() }}
      </span>
    </div>
    <p class="map-marker-popup__location">
      <i class="pi pi-map-marker" aria-hidden="true"></i>
      {{ craftsman().location.city }}
    </p>
    @if (visibleProjectTypes().length > 0) {
    <ul class="map-marker-popup__chips" aria-label="Types de projet">
      @for (project of visibleProjectTypes(); track project) {
      <li>
        <span class="map-marker-popup__chip">{{ projectLabels[project] }}</span>
      </li>
      }
    </ul>
    }
  </div>
</a>
